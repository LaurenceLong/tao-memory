[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tao-memory"
version = "0.1.0"
description = "Causal compressed history attention with explicit per-request state"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE", "NOTICE", "tao_attention/LICENSE"]
authors = [{name = "TaoMemory contributors"}]
keywords = ["attention", "pytorch", "triton", "cuda", "memory"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Operating System :: POSIX :: Linux",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["torch>=2.9,<2.10", "triton>=3.5,<3.6; sys_platform == 'linux'"]

[project.optional-dependencies]
build = ["build>=1.2", "twine>=6"]

[tool.setuptools.packages.find]
include = ["tao_attention", "tao_attention.*"]
exclude = ["tests*", "examples*", "tools*"]

